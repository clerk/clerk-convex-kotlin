name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  create-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest-xlarge
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.get_version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve version from gradle.properties
        id: get_version
        run: |
          set -euo pipefail

          version="$(
            awk -F= '/^CLERK_CONVEX_KOTLIN_VERSION=/{print $2; exit}' gradle.properties |
            tr -d '[:space:]'
          )"
          if [ -z "$version" ]; then
            echo "Missing CLERK_CONVEX_KOTLIN_VERSION in gradle.properties"
            exit 1
          fi
          if [ "${version#v}" != "$version" ]; then
            echo "CLERK_CONVEX_KOTLIN_VERSION must not include a leading v"
            exit 1
          fi

          tag_name="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

          echo "Resolved version: $version"
          echo "Tag name: $tag_name"

      - name: Ensure tag does not already exist
        run: |
          set -euo pipefail

          tag_name="${{ steps.get_version.outputs.tag_name }}"

          if git rev-parse "$tag_name" >/dev/null 2>&1; then
            echo "Tag already exists locally: $tag_name"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag_name" >/dev/null 2>&1; then
            echo "Tag already exists on origin: $tag_name"
            exit 1
          fi

      - name: Create and push tag
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.get_version.outputs.tag_name }}"
          git push origin "${{ steps.get_version.outputs.tag_name }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag_name="${{ steps.get_version.outputs.tag_name }}"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/releases" \
            -f "tag_name=$tag_name" \
            -f "target_commitish=${{ github.event.repository.default_branch }}" \
            -f "name=$tag_name" \
            -F "draft=false" \
            -F "prerelease=false" \
            -F "generate_release_notes=true"

  publish:
    needs: create-release
    if: always() && (github.event_name == 'release' || needs.create-release.result == 'success')
    runs-on: macos-latest-xlarge
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.release_metadata.outputs.tag_name }}
      release_url: ${{ steps.release_metadata.outputs.release_url }}
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME || secrets.MAVEN_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD || secrets.MAVEN_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY || secrets.MAVEN_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY_PASSWORD || secrets.MAVEN_CENTRAL_SIGNING_PASSWORD || secrets.MAVEN_SIGNING_PASSWORD }}
      MAVEN_SIGNING_KEY_ID_RAW: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY_ID || secrets.MAVEN_SIGNING_KEY_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || needs.create-release.outputs.tag_name }}

      - name: Get release metadata
        id: release_metadata
        env:
          EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_URL: ${{ github.event.release.html_url }}
          DISPATCH_RELEASE_TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            tag_name="$EVENT_RELEASE_TAG_NAME"
            release_url="$EVENT_RELEASE_URL"
          else
            tag_name="$DISPATCH_RELEASE_TAG_NAME"
            release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag_name"
          fi

          if [ -z "$tag_name" ]; then
            echo "Failed to determine release tag"
            exit 1
          fi
          if [ -z "$release_url" ]; then
            release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag_name"
          fi

          {
            echo "tag_name=$tag_name"
            echo "release_url=$release_url"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve release version
        run: |
          set -euo pipefail

          version="$(
            awk -F= '/^CLERK_CONVEX_KOTLIN_VERSION=/{print $2; exit}' gradle.properties |
            tr -d '[:space:]'
          )"
          if [ -z "$version" ]; then
            echo "Missing CLERK_CONVEX_KOTLIN_VERSION in gradle.properties"
            exit 1
          fi

          tag_name="${{ github.event_name == 'release' && github.event.release.tag_name || needs.create-release.outputs.tag_name }}"
          tag_version="${tag_name#v}"

          if [ "$tag_version" != "$version" ]; then
            echo "Release tag version ($tag_version) does not match gradle.properties version ($version)"
            exit 1
          fi

          echo "Resolved version: $version"

      - name: Validate publishing credentials
        run: |
          missing=0
          for name in \
            ORG_GRADLE_PROJECT_mavenCentralUsername \
            ORG_GRADLE_PROJECT_mavenCentralPassword \
            ORG_GRADLE_PROJECT_signingInMemoryKey \
            ORG_GRADLE_PROJECT_signingInMemoryKeyPassword
          do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if ! printf '%s' "$ORG_GRADLE_PROJECT_signingInMemoryKey" | grep -q "BEGIN PGP PRIVATE KEY BLOCK"; then
            echo "Signing key secret is present but invalid."
            echo "Expected an ASCII-armored private key (including BEGIN/END lines) in ORG_GRADLE_PROJECT_signingInMemoryKey."
            exit 1
          fi

          if [ -n "$MAVEN_SIGNING_KEY_ID_RAW" ]; then
            normalized_key_id="$(printf '%s' "$MAVEN_SIGNING_KEY_ID_RAW" | tr -d '[:space:]')"
            normalized_key_id="${normalized_key_id#0x}"
            normalized_key_id="${normalized_key_id#0X}"

            if ! printf '%s' "$normalized_key_id" | grep -Eq '^[0-9A-Fa-f]+$'; then
              echo "Invalid signing key ID format. Expected hexadecimal characters only."
              exit 1
            fi

            if [ "${#normalized_key_id}" -lt 8 ]; then
              echo "Invalid signing key ID length. Expected at least 8 hexadecimal characters."
              exit 1
            fi

            normalized_key_id="${normalized_key_id: -8}"
            normalized_key_id="$(printf '%s' "$normalized_key_id" | tr '[:lower:]' '[:upper:]')"
            echo "ORG_GRADLE_PROJECT_signingInMemoryKeyId=$normalized_key_id" >> "$GITHUB_ENV"
          fi

      - name: Publish and release to Maven Central
        run: ./gradlew :source:clerk-convex-kotlin:publishAndReleaseToMavenCentral --stacktrace

  notify-slack:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag_name }}
          RELEASE_URL: ${{ needs.publish.outputs.release_url }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not configured; skipping Slack notification"
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg release_url "$RELEASE_URL" \
            '{
              text: "Clerk Convex Kotlin \($tag) has been released",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "*Clerk Convex Kotlin \($tag) has been released*"
                  }
                },
                {
                  type: "context",
                  elements: [
                    {
                      type: "mrkdwn",
                      text: "<\($release_url)|View the GitHub release>"
                    }
                  ]
                }
              ]
            }')

          curl --fail-with-body \
            --request POST \
            --header "Content-type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
